<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AyushTranslater — Hindi to English Translator</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  min-height:100vh;background:linear-gradient(135deg,#eef2ff,#f8fafc 45%,#e0f2fe);
  color:#172033;display:flex;align-items:center;justify-content:center;padding:24px
}
.app{width:min(1050px,100%);background:rgba(255,255,255,.88);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.8);border-radius:24px;padding:28px;
  box-shadow:0 20px 60px rgba(30,41,59,.14)}
header{text-align:center;margin-bottom:24px}
.logo{display:inline-flex;align-items:center;gap:10px;font-size:28px;font-weight:800}
.logo span{background:#4f46e5;color:white;border-radius:12px;padding:7px 10px;font-size:20px}
header p{margin:8px 0 0;color:#64748b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;overflow:hidden}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #e2e8f0;font-weight:700}
.badge{font-size:12px;color:#4f46e5;background:#eef2ff;padding:6px 9px;border-radius:999px}
textarea{width:100%;height:280px;border:0;outline:0;resize:vertical;padding:18px;font-size:18px;line-height:1.6;color:#172033}
.output{min-height:280px;padding:18px;font-size:18px;line-height:1.6;white-space:pre-wrap}
.placeholder{color:#94a3b8}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;justify-content:center}
button{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px}
.primary{background:#4f46e5;color:white}.secondary{background:#e2e8f0;color:#172033}
.primary:hover{background:#4338ca}.secondary:hover{background:#cbd5e1}
.status{text-align:center;margin-top:14px;color:#64748b;font-size:14px;min-height:20px}
footer{text-align:center;margin-top:20px;color:#94a3b8;font-size:13px}
@media(max-width:760px){.app{padding:18px}.grid{grid-template-columns:1fr}textarea,.output{height:220px;min-height:220px}.logo{font-size:24px}}
</style>
</head>
<body>
<main class="app">
<header>
  <div class="logo"><span>अ→A</span> AyushTranslater</div>
  <p>Simple Hindi → English translation tool</p>
</header>

<section class="grid">
  <div class="card">
    <div class="card-head"><span>Hindi</span><span class="badge">हिन्दी</span></div>
    <textarea id="input" placeholder="यहाँ हिंदी टेक्स्ट लिखें..."></textarea>
  </div>
  <div class="card">
    <div class="card-head"><span>English</span><span class="badge">English</span></div>
    <div id="output" class="output placeholder">Your English translation will appear here...</div>
  </div>
</section>

<div class="controls">
  <button class="primary" id="translate">Translate</button>
  <button class="secondary" id="copy">Copy English</button>
  <button class="secondary" id="speak">🔊 Speak</button>
  <button class="secondary" id="clear">Clear</button>
</div>
<div id="status" class="status"></div>
<footer>Made with ❤️ for Ayush • AyushTranslater</footer>
</main>

<script>
const input=document.getElementById('input'), output=document.getElementById('output'), status=document.getElementById('status');

async function translateText(){
  const text=input.value.trim();
  if(!text){status.textContent="Please enter some Hindi text.";return;}
  status.textContent="Translating…";
  output.classList.remove('placeholder');
  try{
    const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=hi|en';
    const res=await fetch(url);
    const data=await res.json();
    if(data.responseData && data.responseData.translatedText){
      output.textContent=data.responseData.translatedText;
      status.textContent="Translation complete.";
    }else throw new Error("No translation");
  }catch(e){
    output.textContent="Translation couldn't be completed. Check your internet connection and try again.";
    status.textContent="Could not reach the translation service.";
  }
}
document.getElementById('translate').onclick=translateText;
document.getElementById('clear').onclick=()=>{input.value='';output.textContent='Your English translation will appear here...';output.classList.add('placeholder');status.textContent='';};
document.getElementById('copy').onclick=async()=>{
  const text=output.textContent;
  if(!text || output.classList.contains('placeholder')) return;
  try{await navigator.clipboard.writeText(text);status.textContent="English text copied!";}
  catch(e){status.textContent="Copy is unavailable in this browser.";}
};
document.getElementById('speak').onclick=()=>{
  const text=output.textContent;
  if(!text || output.classList.contains('placeholder')) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';speechSynthesis.speak(u);
};
input.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')translateText();});
</script>
</body>
</html>
